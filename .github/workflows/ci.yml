name: CI

on:
  push:
  pull_request:

jobs:
  # The library and the C++ examples must build cleanly with each of the three
  # major host compilers: GCC, Clang (Apple) and MSVC.
  host:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release -j 4

  # A warning is a defect that has not been triggered yet, and a backlog of them
  # is how one hides. This keeps the count at zero.
  warnings:
    name: warnings are errors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror"
      - run: cmake --build build -j 4

  # The library ships as an Arduino library, so every sketch is compiled with
  # the real toolchain for one board from each of the main supported cores.
  arduino:
    name: arduino / ${{ matrix.fqbn }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fqbn:
          - esp32:esp32:esp32
          - esp8266:esp8266:generic
          - arduino:samd:mkrwifi1010
          - rp2040:rp2040:rpipico
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
            - name: esp8266:esp8266
              source-url: https://arduino.esp8266.com/stable/package_esp8266com_index.json
            - name: arduino:samd
            - name: rp2040:rp2040
              source-url: https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
          libraries: |
            - source-path: ./
          sketch-paths: |
            - examples/arduino
